name: CI frontend

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validar frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: corepack pnpm@10.17.0 install --frozen-lockfile
      - name: Comprobar tipos
        run: corepack pnpm@10.17.0 type-check
      - name: Generar aplicación de producción
        run: corepack pnpm@10.17.0 build
